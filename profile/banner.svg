<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Pramaan OSS</title>
  <desc id="d">Open-source building blocks to launch your products and ideas to the market quickly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282834"/>
      <stop offset="1" stop-color="#1f1f29"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#41a1cf" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#41a1cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41a1cf" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#41a1cf"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fefffc" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#fefffc" stroke-opacity="0.1"/>

  <!-- mark: a check inside a ring (proof) -->
  <g transform="translate(88 88)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#41a1cf" stroke-width="3"/>
    <path d="M16 29 l9 9 l18 -19" fill="none" stroke="#fefffc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="162" y="128" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.5" fill="#41a1cf">OPEN SOURCE</text>

  <text x="88" y="220" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" letter-spacing="-2" fill="#fefffc">Pramaan OSS</text>
  <text x="90" y="272" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#fefffc" fill-opacity="0.78">Building blocks to launch your products and ideas to market, fast.</text>

  <!-- routing motif: one call, three providers, the best one lights up -->
  <g fill="none" stroke-linecap="round">
    <path d="M900 180 C 960 180, 980 100, 1050 100" stroke="#fefffc" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M900 180 C 960 180, 980 260, 1050 260" stroke="#fefffc" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M900 180 L1050 180" stroke="url(#line)" stroke-width="3.5"/>
  </g>
  <circle cx="900" cy="180" r="11" fill="#fefffc"/>
  <circle cx="1050" cy="100" r="8" fill="#1f1f29" stroke="#fefffc" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1050" cy="260" r="8" fill="#1f1f29" stroke="#fefffc" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1050" cy="180" r="22" fill="#41a1cf" fill-opacity="0.22"/>
  <circle cx="1050" cy="180" r="11" fill="#41a1cf"/>
  <text x="1084" y="186" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#fefffc">best fit, lowest cost</text>
</svg>
